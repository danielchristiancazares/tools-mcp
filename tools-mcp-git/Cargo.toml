[package]
name = "tools-mcp-git"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Re-exports internal parser APIs for Criterion benchmark targets. Not for downstream use.
bench-api = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tools-mcp-core = { path = "../tools-mcp-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "git_diff_parsers"
harness = false
required-features = ["bench-api"]
