[package]
name = "tools-mcp-semantic"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Re-exports internal embedding APIs for the bench harness. Not for downstream use.
bench-api = []
# Enables the NVIDIA CUDA execution provider on the embedding model.
#
# Off by default; production `cargo build` is unaffected. When enabled, requires a
# CUDA-enabled ONNX Runtime to be available at build time. The current workspace expects:
#
#     $env:ORT_LIB_LOCATION  = "C:\Users\Daniel\onnxruntime\build\Windows\Release\Release"
#     $env:ORT_CUDA_VERSION  = "13"
#
# At runtime the bench harness can prepend BENCH_GPU_DLL_PATHS for lazily loaded
# cuDNN/CUDA transitive imports. The ORT build directory must be available before
# process startup or copied next to the binary by build.rs. See the
# `benches/semantic.rs` module docstring for the full setup.
gpu-cuda = ["dep:ort", "ort/cuda"]

[dependencies]
anyhow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
chrono.workspace = true
fastembed.workspace = true
futures.workspace = true
hex.workspace = true
ignore.workspace = true
lancedb.workspace = true
ort = { workspace = true, optional = true }
qdrant-client.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tools-mcp-core = { path = "../tools-mcp-core" }
tree-sitter.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "semantic_cpu"
path = "benches/semantic.rs"
harness = false
required-features = ["bench-api"]

[[bench]]
name = "semantic_gpu"
path = "benches/semantic.rs"
harness = false
required-features = ["bench-api", "gpu-cuda"]

[[bench]]
name = "semantic_predicates"
harness = false
required-features = ["bench-api"]
