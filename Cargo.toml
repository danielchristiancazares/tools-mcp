[package]
name = "tools-mcp"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.7"
futures = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
readability = "0.3"
scraper = "0.24"
url = "2.5"
robotstxt = "0.3"
walkdir = "2.5"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12.24", features = ["json", "multipart", "rustls-tls", "gzip", "brotli", "deflate"] }
htmd = "0.4.0"
tiktoken-rs = "0.9.1"

[dev-dependencies]
tempfile = "3.10"

[lib]
name = "file_search_core"
path = "src/lib.rs"

[[bin]]
name = "tools-mcp"
path = "src/main.rs"
