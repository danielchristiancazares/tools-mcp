[workspace]
members = [
    "tools-mcp-server",
    "tools-mcp-core",
    "tools-mcp-git",
    "tools-mcp-local",
    "tools-mcp-semantic",
    "tools-mcp-webfetch",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime", "bytes"] }
criterion = "0.8"
fastembed = { version = "5.13.4", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures = "0.3"
glob = "0.3"
hex = "0.4"
htmd = "0.4.0"
ignore = "0.4"
lancedb = "0.29.0"
memchr = "2"
ort = { version = "=2.0.0-rc.12", default-features = false }
regex = "1.12"
regex-syntax = "0.8"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "charset", "http2", "system-proxy"] }
qdrant-client = { version = "1.18.0", default-features = false, features = ["serde"] }
robotstxt = "0.3"
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
tiktoken-rs = "0.9.1"
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "net", "parking_lot", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26.3"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
