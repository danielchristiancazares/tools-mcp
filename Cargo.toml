[package]
name = "tools-mcp"
version = "0.9.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.7"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.11", features = ["json", "multipart", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
readability = "0.3"
htmd = "0.3"
scraper = "0.24"
tiktoken-rs = "0.7"
url = "2.5"
robotstxt = "0.3"
walkdir = "2.5"
uuid = { version = "1.0", features = ["v4"] }
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
proc-macro2 = "1.0"
z3 = { version = "0.12", features = ["static-link-z3"] }
quote = "1.0"

[dev-dependencies]
tempfile = "3.10"

[lib]
name = "file_search_core"
path = "src/lib.rs"

[[bin]]
name = "tools-mcp"
path = "src/main.rs"
